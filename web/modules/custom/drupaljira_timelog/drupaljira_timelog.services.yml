services:

  drupaljira.task_stat:
    class: Drupal\drupaljira_timelog\Service\TaskStatService
    arguments:
      - '@entity_type.manager'

  plugin.manager.report_generator:
    class: Drupal\drupaljira_timelog\ReportGeneratorManager
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'

  drupaljira_timelog.duration_formatter:
    class: Drupal\drupaljira_timelog\Service\DurationFormatter

  drupaljira_timelog.event_subscriber.time_log_created:
    class: Drupal\drupaljira_timelog\EventSubscriber\TimeLogCreatedSubscriber
    arguments:
      - '@logger.factory'
    tags:
      - { name: event_subscriber }