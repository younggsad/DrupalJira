entity.time_log.add_form:
  path: '/time-log/add'
  defaults:
    _controller: '\Drupal\drupaljira_timelog\Controller\TimeLogAddController::add'
    _title: 'Add Time Log'
  requirements:
    _entity_create_access: 'time_log'

entity.time_log.admin_add_form:
  path: '/admin/structure/time-log/add'
  defaults:
    _controller: '\Drupal\drupaljira_timelog\Controller\TimeLogAddController::add'
    _title: 'Add Time Log'
  requirements:
    _permission: 'administer time_log'

entity.time_log.canonical:
  path: '/time-log/{time_log}'
  defaults:
    _entity_form: 'time_log.default'
    _title: 'Time Log'
  requirements:
    _entity_access: 'time_log.view'

entity.time_log.edit_form:
  path: '/time-log/{time_log}/edit'
  defaults:
    _entity_form: 'time_log.edit'
    _title: 'Edit Time Log'
  requirements:
    _entity_access: 'time_log.update'

entity.time_log.delete_form:
  path: '/time-log/{time_log}/delete'
  defaults:
    _entity_form: 'time_log.delete'
    _title: 'Delete Time Log'
  requirements:
    _entity_access: 'time_log.delete'

entity.time_log.collection:
  path: '/admin/content/time-log'
  defaults:
    _entity_list: 'time_log'
    _title: 'Time Logs'
  requirements:
    _permission: 'administer time_log'

drupaljira_timelog.write_off:
  path: '/task/{task}/log-time'
  defaults:
    _form: '\Drupal\drupaljira_timelog\Form\TimeLogWriteOffForm'
    _title: 'Log time'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: '\Drupal\drupaljira_timelog\Access\TimeLogAccessCheck::logTimeAccess'
  options:
    parameters:
      task:
        type: entity:node
        bundle:
          - task

drupaljira_timelog.project_stats:
  path: '/drupaljira/project-stats/{node}'
  defaults:
    _controller: '\Drupal\drupaljira_timelog\Controller\ProjectStatsController::getStats'
  requirements:
    _custom_access: '\Drupal\drupaljira_timelog\Access\TimeLogAccessCheck::projectStatsAccess'
  methods: [GET]
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - project
