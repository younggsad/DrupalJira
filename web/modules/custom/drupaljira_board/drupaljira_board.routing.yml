drupaljira_board.projects:
  path: '/projects'
  defaults:
    _controller: '\Drupal\drupaljira_board\Controller\ProjectsController::page'
    _title: 'Projects'
  requirements:
    _access: 'TRUE'

drupaljira_board.update_status:
  path: '/task/{node}/status'
  defaults:
    _controller: '\Drupal\drupaljira_board\Controller\TaskBoardController::updateStatus'
  methods: [POST]
  requirements:
    _entity_access: 'node.update'
    _csrf_request_header_token: 'TRUE'

drupaljira_board.task_modal:
  path: '/task/{node}/modal'
  defaults:
    _controller: '\Drupal\drupaljira_board\Controller\TaskBoardController::taskModal'
  methods: [GET]
  requirements:
    _entity_access: 'node.view'

drupaljira_board.project_sprints:
  path: '/project/{node}/sprints'
  defaults:
    _controller: '\Drupal\drupaljira_board\Controller\SprintController::page'
    _title: 'Sprints'
  requirements:
    _custom_access: '\Drupal\drupaljira_board\Access\SprintAccessCheck::access'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
