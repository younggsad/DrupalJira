grumphp:
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: 'ddev exec php'

    tasks:
        phpcs:
            standard: phpcs.xml.dist
            triggered_by:
                - php
                - module
                - inc
                - install
                - profile
                - theme
                - engine

        phpstan:
            configuration: phpstan.neon.dist
            ignore_patterns:
                - /^web\/sites\/default\/default\.settings\.php$/
                - /^web\/sites\/default\/settings\.ddev\.php$/
            triggered_by:
                - php